# config.yaml - PROTECT culvert layer engineering
# Loaded by notebooks/culvert_layer_engineering.ipynb.
# Repo-relative paths except raw_root. No secrets here.

project:
  name: protect-culvert-layer
  task: "3.3 Interactive Risk Index Mapping Tool - Assets (culverts)"

paths:
  raw_root: C:\GIS\Culvert      # jurisdiction deliveries (outside the repo; not committed)
  # Prior TRPA basin-wide culvert compilation (READ-ONLY - includes USFS forest roads)
  legacy_culverts: F:\GIS\PROJECTS\Transportation\Protect\PROTECT_analysis\Assets.gdb\Tahoe_Culvert
  # Working analysis geodatabase for the VA (shared with the street network and criticality work)
  analysis_gdb: F:\GIS\PROJECTS\Transportation\Protect\PROTECT_analysis\PROTECT_analysis.gdb
  # Hydro-enforced bare-earth lidar DEM (TRPA raster SDE; 2 m, EPSG 26910, F32). Also served as
  # an image service. Input to the culvert watershed delineation and the DF / AV slope surfaces.
  dem: F:\GIS\DB_CONNECT\Raster.sde\SDE.DEM_BareEarth_LiDAR_2010
  processed: data/processed     # intermediate GeoPackage / parquet (gitignored)
  outputs: outputs              # final File GDB + QA reports (gitignored)
  logs: logs                    # timestamped run logs (gitignored)

sources:
  cslt_culvert_layer: "https://services2.arcgis.com/gWRYLIS16mKUskSO/arcgis/rest/services/Stormwater/FeatureServer/415006"
  trpa_boundary_layer: "https://maps.trpa.org/server/rest/services/Boundaries/MapServer/4"

output:
  gdb_name: culverts.gdb
  feature_class: Culverts             # point feature class (one row per culvert)
  condition_table: CulvertCondition   # standalone table, 1:many inspections
  relationship_class: Culvert_has_Condition
  # Tahoe Basin working CRS: NAD 1983 UTM Zone 10N.
  target_epsg: 26910

run:
  crossing_rule:        # notebook: pipes delivered without a culvert type become culverts when
    jurisdictions: [El Dorado County, Washoe County]   # their line crosses a street centerline
    max_length_m: 60    # longer crossings are storm-drain trunk runs (stands in for NDOT's manhole-run rule)
  build_gdb: true       # set false to skip the arcpy File GDB write
  line_to_point: midpoint   # how pipe centerlines collapse to a point: midpoint | start | end
  legacy_match_m: 25    # legacy points within this many metres of a new asset count as matched

# scripts/load_culverts_gdb.py - load the engineered culvert layer into the analysis geodatabase
assets:
  streets_fc: Streets_Network_Tahoe   # road segments in analysis_gdb; key = segment_id
  streets_key: segment_id
  segment_snap_m: 50                  # max distance from a culvert to its parent road segment
  culverts_fc: Culverts
  condition_table: CulvertCondition
  relationship_class: Culvert_has_Condition
  # scripts/build_bridges.py - NBI points already clipped to the basin, in analysis_gdb
  nbi_basin_fc: National_Bridge_Inventory_Basin
  bridges_fc: Bridges

# scripts/culvert_profile.py - watershed delineation and the culvert profile
# (docs/SCORING_RUBRICS.md sections 2.2, 2.4, 2.5). The terrain and delineate stages are a
# server job (flow direction / accumulation at 2 m over ~600 million cells); F: resolves the
# same on the server, so this file works unchanged from a clone there.
profile:
  work_gdb: F:\GIS\PROJECTS\Transportation\Protect\PROTECT_analysis\PROTECT_terrain.gdb  # terrain rasters
  nlcd: ""                 # NLCD 2021 land cover raster (optional). Blank = no landcover terms
  fill_z_limit_m: 3        # fill sinks shallower than this before flow direction; null = no Fill.
                           # The enforced DEM still has sinks at unbreached crossings (Oct. 8 QA:
                           # two-cell flow loops at the pour cells, accumulation split, flow
                           # truncated at the road fill). Deeper sinks (lakes, basins) are kept.
  cell_m: 2                # delineation cell size. 2 = native. Larger values aggregate the DEM
                           # with MINIMUM (keeps breach channels) for test runs only
  flow_length: true        # compute the longest upstream flow path (needed for Kirpich tc)
  parallel: "75%"          # arcpy parallelProcessingFactor for the raster tools
  breach:                  # cut the road fill through every inventoried culvert before Fill
    enabled: true          # (Oct. 8 QA: the enforcement missed crossings; unbreached creeks spilled
    length_m: 40           #  along ditches and 292 pipes of 24 in or less inherited 100+ ac basins)
    drop_m: 0.3            # breach floor = lowest ground sampled at either end, minus this
    sample_from_m: 8       # ground sampled from this distance out to the line end, both sides
  pour_snap_m: 4           # max-accumulation cell within this distance of the culvert point (the
                           # breach runs through the culvert's own cell; 20 m captured creeks)
  prism_ppt: F:\GIS\PROJECTS\Transportation\Protect\Data\PRISM\prism_ppt_us_30s_2020_avg_30y.tif
  prism_url: https://data.prism.oregonstate.edu/normals/us/800m/ppt/monthly/prism_ppt_us_30s_2020_avg_30y.zip
                           # PRISM 1991-2020 annual precipitation normal, 800 m, mm (scripts/fetch_prism.py)
  regression:              # USGS regional regression for basins over rational_max_sqmi
    nv_jurisdictions: [NDOT, Washoe County, Douglas County]
    ca_jurisdictions: [Caltrans, Placer County, El Dorado County, City of South Lake Tahoe]
    nv_uses: NV            # NV = Thomas 1997 region 1 for Nevada-side culverts (the state's own
                           # equation); CA = Gotvald 2012 Lahontan basin-wide. On the same basin
                           # region 1 gives about one third of Lahontan; the log prints the ratio.
    applicability:         # published ranges (CA Lahontan table 9; NV region 1 table 3)
      area_sqmi: [0.45, 1060]
      precip_in: [11, 85]
  crossing_group_m: 10     # culverts this close on one segment are one crossing (multi-barrel)
  large_culvert_m: 25      # a culvert this close to an NBI culvert-type structure scores with bridges
  tailwater_ft: 6230       # outlet below this elevation is flagged (legal maximum lake level 6229.1)
  dem_vintage_year: 2011   # install_year at or after this postdates the 2010 lidar DEM
  size_breaks_in: [18, 36, 72]   # small / medium / large / major on equivalent diameter
  load_ratio_breaks: [0.5, 1.0, 2.0]  # FL-C S1 classes 0/1/2/3 on load_ratio (SCORING_RUBRICS 2.3); used by the Pro maps
  max_span_in: 144         # larger circular spans are treated as data errors
  cond_stale_year: 2015    # latest inspection before this year is flagged stale
  # Hydrology (SCORING_RUBRICS 2.4). Atlas 14 DDF from the climate pipeline; nearest PFDS point.
  ddf_csv: climate/data/processed/atlas14_ddf.csv
  return_periods: [25, 100]
  headline_rp: 100
  rational_max_sqmi: 1.0   # larger basins are flagged for the USGS regional regression instead
  tc_min_minutes: 5
  tc_max_minutes: 1440
  runoff_c:                # rational-method C by landcover group (default when no NLCD)
    default: 0.35
    forest: 0.35
    shrub: 0.40
    grass: 0.40
    developed: 0.60
    barren: 0.50
    water: 1.00
    wetland: 0.30
  nlcd_groups:             # NLCD class codes -> landcover group
    forest: [41, 42, 43]
    shrub: [52]
    grass: [71, 81, 82]
    developed: [21, 22, 23, 24]
    barren: [31]
    water: [11, 12]
    wetland: [90, 95]
  # Hydraulics. FHWA HDS-5 inlet control, submerged form: HW/D = c (Q/(A D^0.5))^2 + Y - 0.5 S,
  # solved for Q at the headwater criterion hw_d. Culvert slope is assumed (not surveyed).
  hw_d: 1.0
  culvert_slope: 0.02
  inlet_control:
    circular_concrete:        {c: 0.0398, Y: 0.67}   # square edge with headwall
    circular_metal_headwall:  {c: 0.0379, Y: 0.69}
    circular_metal_projecting: {c: 0.0553, Y: 0.54}
    box_concrete:             {c: 0.0400, Y: 0.80}   # 90 and 15 degree wingwalls
    arch_metal:               {c: 0.0496, Y: 0.57}
  manning_n:                 # full-flow capacity cross-check (q_full_cfs)
    concrete: 0.012
    plastic: 0.012
    corrodible_metal: 0.024
    unknown: 0.024

# scripts/ndot_culverts.py - NDOT SAM21 stormwater asset export.
# SENSITIVE / RESTRICTED under the NDOT data sharing agreement (executed Aug. 12, 2026, term
# through Dec. 31, 2027; access limited to the named Data Steward). The source and every
# derived file stay on TRPA-managed storage (F:). Nothing NDOT is written under the repo:
# not data/processed (git-tracked, served by GitHub Pages), not outputs/, not any html page.
# The reader loads straight from F: into the analysis geodatabase via load_culverts_gdb.py.
ndot:
  enabled: true
  jurisdiction: NDOT
  gdb: F:\GIS\PROJECTS\Transportation\Protect\Data\Culvert\NDOT\SAM21_Export_260707-1551\NDOT_Culverts.gdb
  work_dir: F:\GIS\PROJECTS\Transportation\Protect\Data\Culvert\NDOT\qa   # QA CSVs; restricted, stays on F:
  layers:
    pipes: Pipe
    boxes: Reinforced_Concrete_Box
    pipe_inspection: Pipe_Inspection
    box_inspection: RCB_Inspection
  # Statuses dropped before use (hydStatus domain). 29 basin pipes are "Marked for Deletion".
  drop_status: [Abandoned, Relinquished, Removed, Replaced, Marked for Deletion]
  # feature_type rule. The SAM subtype (Storm Drain / Culvert / Down Drain ...) is blank on
  # 98 percent of basin pipes, so: subtype when present; otherwise a pipe that crosses a
  # Streets_Network_Tahoe centerline is a culvert and any other pipe is a stormwater pipe.
  culvert_subtypes: [2, 5]        # Culvert, Driveway/Approach
  pipe_subtypes: [1, 3, 4]        # Storm Drain, Down Drain, Subsurface Drain
  max_diameter_in: 144            # larger values are treated as data errors (one 6300 in. record)
  min_inspection_year: 1990       # earlier dates (an 1899 placeholder) become null
