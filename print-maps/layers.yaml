# layers.yaml - the print maps set up in the Pro project by build_layers.py (Oct. 30, 2026)
# Mirrors html/results.html: the same datasets (PROTECT_curated.gdb carries the fields publish_results.py
# publishes, public jurisdictions only), fields, class breaks, colors (COL), and legend labels as the
# page's Overview views (highest vulnerability, and each hazard's vulnerability on every asset it scores),
# its hazard surfaces, and the Criticality view. Change a break or a color on the page, change it here too.
# Sizes are the page's screen pixels; build_layers.py converts them to points (x 0.75) and multiplies by
# print_scale for the 36 x 48 in poster.
#
# Every map is set up once and finished and exported by hand in Pro: a plain run adds only what is
# missing, and --replace rebuilds (see build_layers.py).

source_gdb: ""             # blank = curated.gdb in the root config.yaml
map: TRPA Standard Layers  # the template's map: its base cartography is what every copied map keeps
group: Results             # the group build_layers.py owns in it, one subgroup per view
place_before: Bridge       # the group goes just above this layer (under the template's labels)
show_group: Overview       # in TRPA Standard Layers itself, this subgroup is on and the others off
hide_after_build: [Hazards, Bridge, Culvert, Road]   # the template's unscored layers, superseded by Results
print_scale: 2.0

colors:                    # results.html COL and CRIT_RAMP
  ice: "#B4CBE8"
  blue: "#0072CE"
  navy: "#003B71"
  peach: "#E8A05A"
  orange: "#E87722"
  brick: "#9C3E27"
  gray: "#cfd4da"
  forest: "#4A6118"
  purple: "#7B6A8A"
  white: "#ffffff"
  crit0: "#042333"         # the Phosphor thermal ramp, criticality quarter 0 (dark) to 3 (bright)
  crit1: "#6E4694"
  crit2: "#F37D4D"
  crit3: "#E8FA5B"

# [upper bound, color, legend label]; a value goes in the first class whose upper bound it does not
# exceed. min is the lower bound of the first class. Values outside every class and nulls draw with the
# default symbol (gray, "not scored"), as the page does, unless the layer says default: false.
class_sets:
  vclass:                  # vClassRenderer: exactly 0 is not exposed (roads carry no sensitivity, V = E)
    min: -1
    classes: [[0.0005, gray, "Not exposed (0)"], [0.999, ice, Low], [1.999, orange, Medium], [3.1, brick, High]]
  wfclass:                 # wfRenderer: Low 1 to under 2, Medium 2 to 2.5, High over 2.5
    min: -1
    classes: [[0.999, gray, None], [1.999, ice, Low], [2.5, orange, Medium], [3.1, brick, High]]
  crit_quarter:            # critRenderer: C_class, the criticality percentile cut at 25, 50, and 75
    min: -0.5
    classes: [[0.5, crit0, "0: lowest quarter"], [1.5, crit1, "1"], [2.5, crit2, "2"], [3.5, crit3, "3: top quarter (most critical)"]]

# [value, color, legend label] for text fields
value_sets:
  vclass_text:             # vClassFieldRenderer: V_class, the highest of the asset's pair classes
    - [Low, ice, Low]
    - [Medium, orange, Medium]
    - [High, brick, High]

line_widths: [0.6, 0.9, 1.2, 1.6]   # LINE_W, by class

# One entry per layer, top to bottom within its group (points over lines over polygons).
# dataset: a feature class in source_gdb, or source: a full path or service URL instead.
# kind: line | point | polygon. classes: a class_sets name or a {min, classes} block of its own; or
# values: a value_sets name for a text field. widths (lines; default line_widths) / sizes (points): one
# per class or one for all. marker: circle | square. dashed: true for paths. alpha: fill opacity per
# class (polygons), with outline_alpha and outline_width (pixels) for the edge. opacity: the layer's own
# opacity. simple: one color for every feature. sort: draw in ascending order of this field, so the
# highest draws on top. legend_descending: list the classes highest first. default: false draws nothing
# for values outside the classes. visible: false to build it off. legend: false keeps it out of legends.
layers:
  - {name: TRPA boundary, source: "https://maps.trpa.org/server/rest/services/Boundaries/FeatureServer/4", kind: polygon, simple: navy, alpha: 0, outline_alpha: 0.95, outline_width: 2, legend: false}

  # Overview, Highest vulnerability: every asset's combined class
  - {name: Transit hubs, group: Overview, dataset: Assets\TransitHubs, kind: point, marker: square, field: V_class, values: vclass_text, sizes: 6}
  - {name: Bridges, group: Overview, dataset: Assets\Bridges, kind: point, marker: square, field: V_class, values: vclass_text, sizes: 11}
  - {name: Culverts, group: Overview, dataset: Assets\Culverts, kind: point, field: V_class, values: vclass_text, sizes: [5, 6, 7]}
  - {name: Paths, group: Overview, dataset: Assets\ActiveTransportation, kind: line, dashed: true, field: V_class, values: vclass_text, widths: [0.9, 1.2, 1.6]}
  - {name: Roads, group: Overview, dataset: Assets\Roads, kind: line, field: V_class, values: vclass_text, widths: [0.9, 1.2, 1.6]}

  # Overview, Flooding: vulnerability on all five asset types; the flood surface
  - {name: Transit hubs, group: Flooding, dataset: Assets\TransitHubs, kind: point, marker: square, field: V_FLTC_hist, classes: vclass, sizes: 6}
  - {name: Bridges, group: Flooding, dataset: Assets\Bridges, kind: point, marker: square, field: V_FLB_hist, classes: vclass, sizes: 11}
  - {name: Culverts, group: Flooding, dataset: Assets\Culverts, kind: point, field: V_FLC_hist, classes: vclass, sizes: [4, 5, 6, 7]}
  - {name: Paths, group: Flooding, dataset: Assets\ActiveTransportation, kind: line, dashed: true, field: V_FLAT_hist, classes: vclass}
  - {name: Roads, group: Flooding, dataset: Assets\Roads, kind: line, field: V_FLR_hist, classes: vclass}
  - name: Flood zones and streams
    group: Flooding
    dataset: HazardSurfaces\Hazard_Flood_Class
    kind: polygon
    field: hz_class
    opacity: 0.9
    classes:
      min: 0.5
      classes: [[1.5, ice, "1: stream crossing"], [2.5, blue, "2: 500-year zone"], [3.5, navy, "3: 100-year zone"]]
    alpha: [0.5, 0.35, 0.45]

  # Overview, Wildfire: vulnerability on roads, paths, and transit hubs; burn probability, and severity (off)
  - {name: Transit hubs, group: Wildfire, dataset: Assets\TransitHubs, kind: point, marker: square, field: V_WFTC_hist, classes: wfclass, sizes: 6}
  - {name: Paths, group: Wildfire, dataset: Assets\ActiveTransportation, kind: line, dashed: true, field: V_WFAT_hist, classes: wfclass}
  - {name: Roads, group: Wildfire, dataset: Assets\Roads, kind: line, field: V_WFR_hist, classes: wfclass}
  - name: Burn probability
    group: Wildfire
    dataset: HazardSurfaces\Hazard_Wildfire_BurnProb
    kind: polygon
    field: hz_class
    opacity: 0.9
    classes:
      min: 0.5
      classes: [[1.5, ice, "1: under 0.5 percent a year"], [2.5, orange, "2: 0.5 to 1 percent"], [3.5, brick, "3: over 1 percent"]]
    alpha: [0.6, 0.5, 0.55]
  - name: Fire severity
    group: Wildfire
    dataset: HazardSurfaces\Hazard_Wildfire_Severity
    kind: polygon
    field: hz_class
    opacity: 0.9
    visible: false
    classes:
      min: 0.5
      classes: [[1.5, ice, "1: low"], [2.5, orange, "2: moderate"], [3.5, brick, "3: high severity"]]
    alpha: [0.6, 0.5, 0.55]

  # Overview, Landslide: vulnerability on roads, culverts, and bridges; the susceptibility surface
  - {name: Bridges, group: Landslide, dataset: Assets\Bridges, kind: point, marker: square, field: V_LSB_hist, classes: vclass, sizes: 11}
  - {name: Culverts, group: Landslide, dataset: Assets\Culverts, kind: point, field: V_LSC_hist, classes: vclass, sizes: [4, 5, 6, 7]}
  - {name: Roads, group: Landslide, dataset: Assets\Roads, kind: line, field: V_LSR_hist, classes: vclass}
  - name: Landslide susceptibility
    group: Landslide
    dataset: HazardSurfaces\Hazard_Landslide_Class
    kind: polygon
    field: hz_class
    opacity: 0.9
    classes:
      min: 0.5
      classes: [[1.5, ice, "1: over 40 to 60 percent of the cell prone"], [2.5, orange, "2: over 60 to 80 percent"], [3.5, brick, "3: over 80 percent, or a recorded landslide"]]
    alpha: [0.6, 0.5, 0.55]

  # Overview, Debris flow: vulnerability on roads, culverts, and bridges. The page has no debris-flow surface;
  # the upslope steepness term (E1) stands in, on the page's exposure-class breaks.
  - {name: Bridges, group: Debris flow, dataset: Assets\Bridges, kind: point, marker: square, field: V_DFB_hist, classes: vclass, sizes: 11}
  - {name: Culverts, group: Debris flow, dataset: Assets\Culverts, kind: point, field: V_DFC_hist, classes: vclass, sizes: [4, 5, 6, 7]}
  - {name: Roads, group: Debris flow, dataset: Assets\Roads, kind: line, field: V_DFR_hist, classes: vclass}
  - name: Upslope steepness
    group: Debris flow
    dataset: HazardSurfaces\Hazard_DebrisFlow_Slope
    kind: polygon
    field: hz_class
    opacity: 0.9
    classes:
      min: 0
      classes: [[0.999, ice, "Low (0.5)"], [1.999, orange, "Medium (1 to 1.5)"], [3.1, brick, "High (2 to 3)"]]
    alpha: [0.6, 0.5, 0.55]

  # Overview, Avalanche: vulnerability on roads; TRPA's mapped zones, and the slope-tier terrain scoring reads
  - {name: Roads, group: Avalanche, dataset: Assets\Roads, kind: line, field: V_AVR_hist, classes: vclass}
  - {name: Avalanche zones, group: Avalanche, dataset: HazardSources\Avalanche_Zones, kind: polygon, simple: purple, alpha: 0.45, opacity: 0.8, label: Mapped avalanche zone}
  - name: Avalanche terrain
    group: Avalanche
    dataset: HazardSurfaces\Hazard_Avalanche_Cells
    kind: polygon
    field: tier
    opacity: 0.9
    default: false         # tier 0 (under 25 degrees, or no ground above) draws nothing
    classes:
      min: 0.5
      classes: [[1.5, ice, "1: 25 to 30 or over 50 degrees"], [2.5, orange, "2: 30 to 35 or 45 to 50 degrees"], [3.5, brick, "3: 35 to 45 degrees"]]
    alpha: [0.45, 0.5, 0.55]

# Whole maps build_layers.py makes from scratch (spatial_reference, a basemap from Pro's Basemap gallery)
# with their own group. Layers without a group sit in the map's group directly.
maps:
  # The Results page's Criticality view: roads by criticality quarter on the Phosphor thermal ramp, on the
  # dark gray basemap where the bright top quarter stands out, with the TRPA boundary in TRPA Ice.
  - name: PROTECT Criticality
    spatial_reference: 26910
    basemap: Dark Gray Canvas
    group: Criticality
    layers:
      - {name: Road criticality, dataset: Assets\Roads, kind: line, field: C_class, classes: crit_quarter, sort: C_class, legend_descending: true}
      - {name: TRPA boundary, source: "https://maps.trpa.org/server/rest/services/Boundaries/FeatureServer/4", kind: polygon, simple: ice, alpha: 0, outline_alpha: 0.9, outline_width: 2, legend: false}

# ---------- the print maps: every one 36 x 48 in portrait, from the same template ----------
template: Hazard Fire - North Shore- PROTECT   # its legend box, logo, and title block are on every layout
frame: Map Frame
legend_fit: AdjustColumnsAndFont   # the legend box keeps its size; the columns and text fit the items
layout_elements:
  Lake Tahoe: false        # the template's lake label is placed for the SR 28 view

# Where a layout looks: label goes in the layout's name, title in its Title element. part: the north or
# south half of the layer's extent, overlapping the middle by overlap_pct.
views:
  basin: {label: Lake Tahoe Basin, title: "Lake Tahoe \r\nBasin\n\n", extent: {layer: TRPA boundary, margin_pct: 3}}
  north: {label: North Lake Tahoe, title: "North Lake \r\nTahoe\n\n", extent: {layer: TRPA boundary, part: north, overlap_pct: 5, margin_pct: 3}}
  south: {label: South Lake Tahoe, title: "South Lake \r\nTahoe\n\n", extent: {layer: TRPA boundary, part: south, overlap_pct: 5, margin_pct: 3}}

# One entry per map: a copy of copy_of named "PROTECT <name>" with only show on inside the Results group
# (a subgroup name turns on all of it; Group\Layer picks one layer), or map: one of maps: above. A layout
# per view, "<name> - <view label> - PROTECT", with legend_title in its Legend Title.
sheets:
  - {name: Criticality, map: PROTECT Criticality, views: [basin], legend_title: Road Criticality}
  - {name: Vulnerability, copy_of: TRPA Standard Layers, show: [TRPA boundary, Overview], views: [basin], legend_title: Highest Vulnerability}

  # each hazard north and south: the surface with the assets by vulnerability
  - {name: Flooding, copy_of: TRPA Standard Layers, show: [TRPA boundary, Flooding], views: [north, south], legend_title: Flooding Vulnerability}
  - name: Wildfire
    copy_of: TRPA Standard Layers
    show: [TRPA boundary, Wildfire\Transit hubs, Wildfire\Paths, Wildfire\Roads, Wildfire\Burn probability]
    views: [north, south]
    legend_title: Wildfire Vulnerability
  - {name: Landslide, copy_of: TRPA Standard Layers, show: [TRPA boundary, Landslide], views: [north, south], legend_title: Landslide Vulnerability}
  - {name: Debris Flow, copy_of: TRPA Standard Layers, show: [TRPA boundary, Debris flow], views: [north, south], legend_title: Debris Flow Vulnerability}
  - {name: Avalanche, copy_of: TRPA Standard Layers, show: [TRPA boundary, Avalanche], views: [north, south], legend_title: Avalanche Vulnerability}

  # each hazard basin-wide: the surface alone
  - {name: Flooding Hazard, copy_of: TRPA Standard Layers, show: [TRPA boundary, Flooding\Flood zones and streams], views: [basin], legend_title: Flooding Hazard}
  - {name: Wildfire Hazard, copy_of: TRPA Standard Layers, show: [TRPA boundary, Wildfire\Burn probability], views: [basin], legend_title: Wildfire Likelihood}
  - {name: Landslide Hazard, copy_of: TRPA Standard Layers, show: [TRPA boundary, Landslide\Landslide susceptibility], views: [basin], legend_title: Landslide Susceptibility}
  - {name: Debris Flow Hazard, copy_of: TRPA Standard Layers, show: [TRPA boundary, Debris flow\Upslope steepness], views: [basin], legend_title: Debris Flow Steepness}
  - {name: Avalanche Hazard, copy_of: TRPA Standard Layers, show: [TRPA boundary, Avalanche\Avalanche zones, Avalanche\Avalanche terrain], views: [basin], legend_title: Avalanche Terrain}
