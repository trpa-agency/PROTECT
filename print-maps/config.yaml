# config.yaml - PROTECT print maps (lives in PROTECT/print-maps/)
# Read by print_maps.py. Paths are relative to this print-maps/ folder unless absolute. No secrets here.
# The Pro project and its data stay on TRPA storage (F:); PDFs land in outputs/ (gitignored).

project:
  aprx: F:\GIS\PROJECTS\Transportation\Protect\PROTECT_analysis\PROTECT_analysis.aprx   # CURRENT when run from Pro's Python window
  layout: Hazard Fire - North Shore- PROTECT   # the sample: 36 x 48 in portrait, frame on TRPA Standard Layers at 1:24,000
  pagx: ""                 # optional: a .pagx to import as the template instead (its maps reuse the project's maps)
  frame: Map Frame         # the map frame the sheet's map, layers, and extent apply to
  legend_sync_visibility: true   # legends drop the layers a sheet turns off

paths:
  outputs: F:\GIS\PROJECTS\Transportation\Protect\PROTECT_analysis\Maps   # <outputs>/<export name>/<file_prefix><sheet id>.<ext>;
                           # where the hand exports go too, readable from the workstation for review
  logs: logs               # timestamped run logs (gitignored)
  restricted_outputs: ""   # --allow-restricted writes here only; must be on F:, never under the repo
  file_prefix: PROTECT_W1_

# Export settings, by name. format: PDF, PNG, JPEG, TIFF, SVG, EPS, or AIX. dpi sets the resolution.
# options are the export format's own properties (arcpy.mp PDFFormat and so on), for example
# embedFonts, imageQuality, outputAsImage, clipToElements. layout: export from another layout in the
# project with the same element names (a 16:9 screen layout), instead of project.layout.
# combine: PDF only, also write <file_prefix>all.pdf with every sheet in order (skipped with --only).
exports:
  poster:                  # large format for the stations and the facilitators
    format: PDF
    dpi: 300
    options: {}
  screen:                  # the on-screen reveal
    format: PDF
    dpi: 150
    combine: true
    options: {}

# Applies to every sheet; a sheet's own keys win. text keys are text element names on the layout;
# values take {legend}, {corridor}, {hazard}, {id}, {date} (house style, Oct. 28, 2026), anything in
# tokens, and any other plain field of the sheet. The template's Title holds the corridor (set from
# corridors: below) and Legend Title the hazard. elements turns layout elements on or off by name.
# managed: the layers a sheet's layers list controls. Inside them, what a sheet lists turns on and
# the rest turns off; every layer outside them (hillshade, water, county, highway, boundaries,
# labels, basemap) stays as authored in the template. Without managed, a sheet's list is the whole map.
tokens:
  workshop: Workshop 1, Nov. 9, 2026
defaults:
  managed: [Results, Hazards, Bridge, Culvert, Road]   # Results: the group build_layers.py builds from layers.yaml
  always_on: []
  text:
    Legend Title: "{legend}"
  elements: {}
  exports: [poster]

# NDOT culvert rows need NDOT sign-off before any display (data sharing agreement; root config.yaml ndot:).
# Before a sheet exports, every visible feature layer is checked. It fails when it reads the NDOT export
# or the restricted curated geodatabase (from the root config.yaml, plus blocked_sources); when it shows
# a row matching a row check (the check honors the layer's definition query); or when it reads one of the
# analysis geodatabase's culvert datasets (check_required_datasets, plus full paths in
# check_required_sources) and has none of the check fields.
restricted:
  row_checks:
    - {field: jurisdiction, values: [NDOT]}
    - {field: restricted, values: [1]}     # CulvertCrossings: a crossing with an NDOT culvert
  blocked_sources: []
  check_required_datasets: [Culverts, CulvertCondition, CulvertCrossings, CulvertWatersheds, CulvertProfile]
  check_required_sources: []


# The print maps are set up by build_layers.py from the sheets in layers.yaml (a map and a layout per
# view each) and finished and exported by hand in Pro (Oct. 30). print_maps.py export is a batch option
# for layouts already in the project: a sheet with layout: and no layers exports that layout as built.
# The keys a sheet can carry:
# layout: export from this layout in the project instead of project.layout (an export's own layout wins).
# layers: what shows within managed (or the whole map without it). Parent groups turn on with a listed
# layer, and every layer inside a listed group turns on. Leave layers out to keep the map as authored.
# map: the Pro map for the main frame (default: whatever the template frame shows).
# extent: {bookmark: name} | {layer: name} | {xy: [xmin, ymin, xmax, ymax]} in the map's coordinates
# (TRPA Standard Layers is Web Mercator), plus optional scale; leave it out to keep the template's.
# frames: other map frames on the layout, {frame name: {map, layers, extent}}, for an inset. Each frame
# on a sheet needs its own Pro map, since layer visibility belongs to the map.
# enabled: false keeps a sheet out of a full run (--only still exports it).
# corridors, hazards, versions, and sheet_matrix (print_maps.expand_matrix) generate corridor x hazard
# sheets; none are set while the maps come from layers.yaml.
sheets:
  - id: basin_criticality
    layout: Criticality - Lake Tahoe Basin - PROTECT
    legend: Road Criticality
    exports: [poster, screen]

# Local copies of the network layers the print maps draw (localize_sources.py, Nov. 4, 2026), so a poster
# export does not wait on services. export pulls each feature layer into vectors: (a file geodatabase) and each
# image service into rasters: (a folder), clipped to extent: plus margin_km (extent = the union of the layouts'
# map frames, Web Mercator). apply --aprx repoints the maps the layouts use: a feature layer whose service URL
# matches a features: entry keeps its renderer and labels and reads the local copy; a map image layer listed
# under map_image: is replaced by feature layers of its visible sublayers (the service's own renderer, same
# scale range) or turned off; an image service listed under image_services: becomes a raster layer on the
# local file with the same colorizer, transparency, and blend. Everything else (vector tile basemaps, the
# local geodatabases) is left alone.
local_sources:
  vectors: C:\GIS\PROTECT_local\PROTECT_reference.gdb
  rasters: C:\GIS\PROTECT_local\rasters
  extent: {xmin: -13401888, ymin: 4666547, xmax: -13328115, ymax: 4781806, wkid: 3857}
  margin_km: 8
  features:                 # where: only these rows are pulled (the layer's own definition query stays on the layer)
    - {url: "https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/NHDPlus_High_Resolution_9March2023_view/FeatureServer/0", name: NHDPlusHR_Flowlines, where: "fcode = 46006"}
    - {url: "https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/NHDPlus_High_Resolution_9March2023_view/FeatureServer/1", name: NHDPlusHR_Waterbodies}
    - {url: "https://maps.trpa.org/server/rest/services/Boundaries/FeatureServer/4", name: TRPA_Boundary}
    - {url: "https://maps.trpa.org/server/rest/services/Boundaries/MapServer/4", name: TRPA_Boundary}        # same data as FeatureServer/4
    - {url: "https://maps.trpa.org/server/rest/services/Boundaries/FeatureServer/3", name: County}
    - {url: "https://maps.trpa.org/server/rest/services/DataDownloader_Transportation/MapServer/0", name: Major_Highways}
    - {url: "https://maps.trpa.org/server/rest/services/Streams_and_Flood_Zone/MapServer/1", name: Streams_Lakes_LiDAR}
    - {url: "https://maps.trpa.org/server/rest/services/Streams_and_Flood_Zone/MapServer/2", name: Lake_Tahoe_High_Water}
  image_services: {}        # service name as the layer's connection carries it -> {url, template (raster function), cell_size (map
                            # units), name (file)}. The Terrain multi-directional hillshade stays on the service by choice (Nov. 4,
                            # 2026); pulling it would be "WorldElevation/Terrain": {url: https://elevation.arcgis.com/arcgis/rest/services/WorldElevation/Terrain/ImageServer,
                            # template: Multi-Directional_Hillshade, cell_size: 5, name: terrain_mdhillshade_5m.tif}, 24 tiles of 4,800 px
  map_image:                # by service URL: convert (visible sublayers -> local feature layers) or off
    "https://maps.trpa.org/server/rest/services/Streams_and_Flood_Zone/MapServer": convert
    "https://maps.trpa.org/server/rest/services/Boundaries/MapServer": convert
    "https://maps.trpa.org/server/rest/services/Transportation/MapServer": "off"   # only Corridors is on, and it draws at 1:85,000 and smaller only: never on the 36 x 48 sheets
