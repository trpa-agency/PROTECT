# config.yaml - PROTECT print maps (lives in PROTECT/print-maps/)
# Read by print_maps.py. Paths are relative to this print-maps/ folder unless absolute. No secrets here.
# The Pro project and its data stay on TRPA storage (F:); PDFs land in outputs/ (gitignored).

project:
  aprx: F:\GIS\PROJECTS\Transportation\Protect\PROTECT_analysis\PROTECT_analysis.aprx   # CURRENT when run from Pro's Python window
  layout: Hazard Fire - North Shore- PROTECT   # the sample: 36 x 48 in portrait, frame on TRPA Standard Layers at 1:24,000
  pagx: ""                 # optional: a .pagx to import as the template instead (its maps reuse the project's maps)
  frame: Map Frame         # the map frame the sheet's map, layers, and extent apply to
  legend_sync_visibility: true   # legends drop the layers a sheet turns off

paths:
  outputs: outputs         # <outputs>/<export name>/<file_prefix><sheet id>.<ext> (gitignored)
  logs: logs               # timestamped run logs (gitignored)
  restricted_outputs: ""   # --allow-restricted writes here only; must be on F:, never under the repo
  file_prefix: PROTECT_W1_

# Export settings, by name. format: PDF, PNG, JPEG, TIFF, SVG, EPS, or AIX. dpi sets the resolution.
# options are the export format's own properties (arcpy.mp PDFFormat and so on), for example
# embedFonts, imageQuality, outputAsImage, clipToElements. layout: export from another layout in the
# project with the same element names (a 16:9 screen layout), instead of project.layout.
# combine: PDF only, also write <file_prefix>all.pdf with every sheet in order (skipped with --only).
exports:
  poster:                  # large format for the stations and the facilitators
    format: PDF
    dpi: 300
    options: {}
  screen:                  # the on-screen reveal
    format: PDF
    dpi: 150
    combine: true
    options: {}

# Applies to every sheet; a sheet's own keys win. text keys are text element names on the layout;
# values take {title}, {legend}, {id}, {date} (house style, Oct. 28, 2026), anything in tokens, and
# any other plain field of the sheet. The template's Title holds the place and Legend Title the
# hazard; Title is left as authored until a sheet sets text: {Title: ...}. elements turns layout
# elements on or off by name.
# managed: the layers a sheet's layers list controls. Inside them, what a sheet lists turns on and
# the rest turns off; every layer outside them (hillshade, water, county, highway, boundaries,
# labels, basemap) stays as authored in the template. Without managed, a sheet's list is the whole map.
tokens:
  workshop: Workshop 1, Nov. 9, 2026
defaults:
  managed: [Hazards, Bridge, Culvert, Road]
  always_on: []
  text:
    Legend Title: "{legend}"
  elements: {}
  exports: [poster]

# NDOT culvert rows need NDOT sign-off before any display (data sharing agreement; root config.yaml ndot:).
# Before a sheet exports, every visible feature layer is checked. It fails when it reads the NDOT export
# or the restricted curated geodatabase (from the root config.yaml, plus blocked_sources); when it shows
# a row matching a row check (the check honors the layer's definition query); or when it reads one of the
# analysis geodatabase's culvert datasets (check_required_datasets, plus full paths in
# check_required_sources) and has none of the check fields.
restricted:
  row_checks:
    - {field: jurisdiction, values: [NDOT]}
    - {field: restricted, values: [1]}     # CulvertCrossings: a crossing with an NDOT culvert
  blocked_sources: []
  check_required_datasets: [Culverts, CulvertCondition, CulvertCrossings, CulvertWatersheds, CulvertProfile]
  check_required_sources: []

# The sheet list: one entry per printed map. id names the output file (--only 01 matches 01_...).
# layers: what shows within managed (or the whole map without it). Parent groups turn on with a listed
# layer, and every layer inside a listed group turns on. Leave layers out to keep the map as authored.
# map: the Pro map for the main frame (default: whatever the template frame shows).
# extent: {bookmark: name} | {layer: name} | {xy: [xmin, ymin, xmax, ymax]} in the map's coordinates
# (TRPA Standard Layers is Web Mercator), plus optional scale; leave it out to keep the template's.
# frames: other map frames on the layout, {frame name: {map, layers, extent}}, for an inset. Each frame
# on a sheet needs its own Pro map, since layer visibility belongs to the map.
# enabled: false keeps a sheet out of a full run (--only still exports it).
#
# Seeded from the Workshop 1 print-map spec (html/workshop-punchlist.html) with the layer names in
# PROTECT_analysis.aprx as of Oct. 13, 2026. Not in the map yet: vulnerability-classed asset layers
# (Bridge, Culvert, and Road draw one plain symbol), active transport, transit centers, scenario layers,
# one combined debris-flow surface, and a basin bookmark (every sheet keeps the SR 28 view).
sheets:
  - id: 01_flooding_exposure
    legend: Flooding Exposure
    layers: [Hazard_Flood_Class]
    exports: [poster, screen]
  - id: 02_flooding_assets
    legend: Flooding Exposure and Assets
    layers: [Hazard_Flood_Class, Road, Bridge, Culvert]
  - id: 03_wildfire_exposure
    legend: Wildfire Burn Probability
    layers: [Hazard_Wildfire_BurnProb]
    exports: [poster, screen]
  - id: 04_wildfire_assets
    legend: Wildfire Exposure and Assets
    layers: [Hazard_Wildfire_BurnProb, Road]
  - id: 05_landslide_exposure
    legend: Landslide Susceptibility
    layers: [Hazard_Landslide_Class]
    exports: [poster, screen]
  - id: 06_landslide_assets
    legend: Landslide Exposure and Assets
    layers: [Hazard_Landslide_Class, Road, Bridge, Culvert]
  - id: 07_debris_flow_exposure
    legend: Debris Flow Exposure
    layers: [Hazard_DebrisFlow_Slope]      # slope term only; Hazard_DebrisFlow_Area is the drainage-size term
    exports: [poster, screen]
  - id: 08_debris_flow_assets
    legend: Debris Flow Exposure and Assets
    layers: [Hazard_DebrisFlow_Slope, Road, Bridge, Culvert]
  - id: 09_avalanche_exposure
    legend: Avalanche Terrain
    layers: [Hazard_Avalanche_Cells]
    exports: [poster, screen]
  - id: 10_avalanche_assets
    legend: Avalanche Exposure and Assets
    layers: [Hazard_Avalanche_Cells, Road]
  - id: 11_scenario_1
    legend: "Scenario 1: SR-89 West Shore Wildfire Closure"
    layers: [Scenario 1]
    enabled: false         # no scenario layers in the map yet
  - id: 12_scenario_2
    legend: Scenario 2
    layers: [Scenario 2]
    enabled: false         # location and hazard not decided
  - id: 13_criticality
    legend: Criticality
    layers: [Criticality]
    enabled: false         # if time allows: the context sheet at the entrance
